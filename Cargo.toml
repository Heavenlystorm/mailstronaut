[workspace]
members = ["crates/*"]
default-members = ["crates/mailstronaut"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/eduardz1/mailstronaut"
homepage = "https://github.com/eduardz1/mailstronaut"
description = "A local-first COSMIC email client (planning scaffold)"
keywords = ["email", "cosmic", "imap", "servo", "desktop"]
categories = ["email", "gui"]
readme = "../../README.md"

# Add third-party dependencies here, when their implementation milestone begins.
# The researched dependency list is in docs/DEPENDENCIES.md.
[workspace.dependencies]
cosmic = { package = "libcosmic", git = "https://github.com/pop-os/libcosmic", rev = "8990a058e1deb8f9f7f4c0a42f6b1362fa1437ec", features = ["wgpu"] }
rusqlite = { version = "=0.40.0", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
chrono-tz = "=0.10.4"
url = "=2.5.8"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
rustix = { version = "=1.1.6", features = ["process", "stdio"] }
snix-serde = { git = "https://git.snix.dev/snix/snix.git", rev = "f393b22aa9b8e0e74c9e8d67f15454409299e510" }
mailstronaut-config = { path = "crates/mailstronaut-config" }
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
directories = "6"
wait-timeout = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Enable every active Clippy group, including opt-in groups. Restriction lints
# can contradict each other; exceptions must be narrow and explain their reason.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
# The user explicitly requested all lints, including the restriction group.
blanket_clippy_restriction_lints = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
