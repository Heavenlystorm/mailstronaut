[workspace]
members = ["crates/*"]
default-members = ["crates/mailstronaut"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/eduardz1/mailstronaut"
description = "A local-first native Wayland email client"
keywords = ["email", "gpui", "imap", "blitz", "desktop"]
categories = ["email", "gui"]
readme = "../../README.md"

# Add third-party dependencies here, when their implementation milestone begins.
# The researched dependency list is in docs/DEPENDENCIES.md.
[workspace.dependencies]
gpui-kit = "=0.8.1"
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io"] }
blitz-dom = { version = "=0.3.0-beta.2", default-features = false, features = ["system-fonts", "floats", "complex-scripts"] }
blitz-html = { version = "=0.3.0-beta.2", default-features = false }
blitz-paint = { version = "=0.3.0-beta.2", default-features = false }
blitz-traits = { version = "=0.3.0-beta.2", default-features = false }
anyrender = "=0.13.0"
anyrender_vello_cpu = { version = "=0.17.0", features = ["multithreading"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ammonia = "=4.2.4"
async-channel = "=2.5.0"
http = "1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
oauth2 = { version = "=5.0.0", default-features = false, features = ["timing-resistant-secret-traits"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
uuid = { version = "=1.29.0", features = ["v4"] }
mail-parser = { version = "=1.0.0", features = ["full_encoding"] }
mail-threading = "=0.1.3"
rusqlite = { version = "=0.38.0", features = ["bundled"] }
rusqlite_migration = "=2.4.1"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
chrono-tz = "=0.10.4"
chrono = "=0.4.45"
url = "=2.5.8"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
rustix = { version = "=1.1.6", features = ["process", "stdio", "fs"] }
snix-serde = { git = "https://git.snix.dev/snix/snix.git", rev = "f393b22aa9b8e0e74c9e8d67f15454409299e510" }
mailstronaut-config = { path = "crates/mailstronaut-config" }
mailstronaut-core = { path = "crates/mailstronaut-core" }
mailstronaut-render = { path = "crates/mailstronaut-render" }
mailstronaut-mail = { path = "crates/mailstronaut-mail" }
oo7 = { version = "=0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
secrecy = "=0.10.3"
async-imap = { version = "=0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
rustls-pemfile = "2"
futures-util = "=0.3.34"
# async-imap's wire trace contains LOGIN/SASL commands and complete responses.
# Compile those debug/trace records out even if RUST_LOG requests protocol trace.
log = { version = "=0.4.34", features = ["max_level_info", "release_max_level_info"] }
base64 = "=0.23.1"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "rustls-native-certs"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
directories = "6"
wait-timeout = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Strict correctness, maintainability and performance checks without blanket
# restriction rules that prescribe contradictory styles or duplicate versions.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Retain source locations in backtraces without full variable/type debug data.
# The test profile inherits these settings; incremental builds stay enabled.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
