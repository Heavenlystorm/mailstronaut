[workspace]
members = ["crates/*"]
default-members = ["crates/mailstronaut"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/eduardz1/mailstronaut"
description = "A local-first COSMIC email client (planning scaffold)"
keywords = ["email", "cosmic", "imap", "servo", "desktop"]
categories = ["email", "gui"]
readme = "../../README.md"

# Add third-party dependencies here, when their implementation milestone begins.
# The researched dependency list is in docs/DEPENDENCIES.md.
[workspace.dependencies]
cosmic = { package = "libcosmic", git = "https://github.com/pop-os/libcosmic", rev = "8990a058e1deb8f9f7f4c0a42f6b1362fa1437ec", features = ["wgpu"] }
servo = { version = "=0.7.0", default-features = false, features = ["baked-in-resources"] }
ammonia = "=4.2.4"
async-channel = "=2.5.0"
http = "1"
content-security-policy = "=0.9.0"
uuid = { version = "=1.29.0", features = ["v4"] }
mail-parser = { version = "=1.0.0", features = ["full_encoding"] }
rusqlite = { version = "=0.38.0", features = ["bundled"] }
rusqlite_migration = "=2.4.1"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
chrono-tz = "=0.10.4"
chrono = "=0.4.45"
url = "=2.5.8"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
rustix = { version = "=1.1.6", features = ["process", "stdio", "fs"] }
snix-serde = { git = "https://git.snix.dev/snix/snix.git", rev = "f393b22aa9b8e0e74c9e8d67f15454409299e510" }
mailstronaut-config = { path = "crates/mailstronaut-config" }
mailstronaut-core = { path = "crates/mailstronaut-core" }
mailstronaut-render = { path = "crates/mailstronaut-render" }
mailstronaut-mail = { path = "crates/mailstronaut-mail" }
oo7 = { version = "=0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
secrecy = "=0.10.3"
async-imap = { version = "=0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
rustls-pemfile = "2"
futures-util = "=0.3.34"
# async-imap's wire trace contains LOGIN/SASL commands and complete responses.
# Compile those debug/trace records out even if RUST_LOG requests protocol trace.
log = { version = "=0.4.34", features = ["max_level_info", "release_max_level_info"] }
base64 = "=0.23.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
directories = "6"
wait-timeout = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Strict correctness, maintainability and performance checks without blanket
# restriction rules that prescribe contradictory styles or duplicate versions.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Retain source locations in backtraces without full variable/type debug data.
# The test profile inherits these settings; incremental builds stay enabled.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
