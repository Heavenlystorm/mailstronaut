# Development backends and linker are selected by nix develop.
# The former browser's four LLVM exceptions were retired with that dependency.
# Release packaging excludes development configuration and uses stable LLVM.

# Pulp 0.22.3 uses exact assembly link names with the LLVM '\x01' marker.
# Cranelift leaves its SIMD store symbols unresolved when linking Vello CPU.
# Keep this single demonstrated exception until Cranelift supports that marker.
[profile.dev.package.pulp]
codegen-backend = "llvm"

[profile.test.package.pulp]
codegen-backend = "llvm"

# Vello's AVX2 conversion uses an intrinsic not implemented by pinned Cranelift.
# The renderer test's backtrace identifies fearless_simd::Avx2::cvt_u32_f32x8.
[profile.dev.package.fearless_simd]
codegen-backend = "llvm"

[profile.test.package.fearless_simd]
codegen-backend = "llvm"

# These two crates instantiate fearless_simd's inline AVX2 raster kernels.
# Changing only fearless_simd still aborts in vello_common::strip::render_impl.
[profile.dev.package.vello_common]
codegen-backend = "llvm"

[profile.test.package.vello_common]
codegen-backend = "llvm"

[profile.dev.package.vello_cpu]
codegen-backend = "llvm"

[profile.test.package.vello_cpu]
codegen-backend = "llvm"

# Image painting instantiates another fearless_simd kernel in AnyRender's RGBA
# premultiplication. Cranelift aborts on llvm.x86.avx2.psrl.w in
# anyrender_vello_cpu::image_convert::premultiply_rgba8_impl (inline-image test).
[profile.dev.package.anyrender_vello_cpu]
codegen-backend = "llvm"

[profile.test.package.anyrender_vello_cpu]
codegen-backend = "llvm"
